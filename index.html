<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時醫療傳譯 · MedInterpret</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap');
  :root {
    --bg:#070b12;--surface:#0d1520;--surface2:#111e2e;--border:#1a2d45;
    --accent:#00d4ff;--accent2:#0066ff;--green:#00e5a0;--amber:#ffb347;
    --red:#ff4d6a;--text:#e8f0fa;--muted:#5a7090;--sub:#8aa5c0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans TC',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:var(--surface);}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .logo-text{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;letter-spacing:0.05em;}
  .logo-text span{color:var(--accent);}
  .header-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
  .dot.listening{background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 0.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  main{flex:1;display:flex;flex-direction:column;padding:16px;max-width:1100px;width:100%;margin:0 auto;gap:14px;}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .mode-label{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}
  .mode-btn{padding:8px 16px;border:1px solid var(--border);background:transparent;color:var(--sub);border-radius:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;transition:all 0.2s;}
  .mode-btn.active{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent;color:#fff;font-weight:500;}
  .mic-btn{margin-left:auto;padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.2s;font-family:'Inter',sans-serif;}
  .mic-btn.start{background:linear-gradient(135deg,var(--green),#00b87a);color:#001a0f;}
  .mic-btn.stop{background:linear-gradient(135deg,var(--red),#cc2244);color:#fff;animation:mic-glow 1.5s infinite;}
  @keyframes mic-glow{0%,100%{box-shadow:0 0 0 0 rgba(255,77,106,0.3)}50%{box-shadow:0 0 0 8px rgba(255,77,106,0)}}
  .settings-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--sub);flex-wrap:wrap;}
  .settings-row label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .settings-row input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;}
  .clear-btn{margin-left:auto;padding:4px 12px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:all 0.2s;}
  .clear-btn:hover{border-color:var(--red);color:var(--red);}
  .error-banner{background:rgba(255,77,106,0.1);border:1px solid rgba(255,77,106,0.3);color:var(--red);padding:10px 16px;border-radius:8px;font-size:13px;display:none;}
  .display-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:320px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
  .panel-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface2);}
  .panel-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;padding:3px 8px;border-radius:4px;}
  .tag-source{background:rgba(0,212,255,0.1);color:var(--accent);border:1px solid rgba(0,212,255,0.2);}
  .tag-translation{background:rgba(0,229,160,0.1);color:var(--green);border:1px solid rgba(0,229,160,0.2);}
  .panel-lang{font-size:12px;color:var(--muted);margin-left:auto;font-family:'IBM Plex Mono',monospace;}
  .panel-body{flex:1;padding:16px;overflow-y:auto;scroll-behavior:smooth;}
  .panel-body::-webkit-scrollbar{width:4px;}
  .panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .transcript-item{margin-bottom:16px;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .transcript-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:4px;}
  .transcript-text{font-size:17px;line-height:1.7;color:var(--text);font-family:'Noto Sans TC','Inter',sans-serif;}
  .transcript-text.interim{color:var(--sub);font-style:italic;}
  .translation-text{font-size:17px;line-height:1.7;color:var(--text);font-family:'Noto Sans TC','Inter',sans-serif;}
  .translation-text.loading{color:var(--muted);display:flex;align-items:center;gap:6px;}
  .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .med-term{background:rgba(255,179,71,0.12);color:var(--amber);border-bottom:1px dotted var(--amber);padding:0 2px;border-radius:2px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--muted);text-align:center;padding:30px;}
  .empty-icon{font-size:36px;opacity:0.4;}
  .empty-text{font-size:13px;line-height:1.6;}
  /* SUBTITLE BAR */
  .subtitle-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;}
  .subtitle-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,var(--accent),var(--green));border-radius:3px 0 0 3px;}
  .subtitle-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);white-space:nowrap;writing-mode:vertical-rl;transform:rotate(180deg);}
  .subtitle-content{flex:1;min-width:0;}
  .subtitle-original{font-size:12px;color:var(--sub);margin-bottom:3px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .subtitle-translated{font-size:20px;font-weight:500;color:var(--text);min-height:28px;line-height:1.4;font-family:'Noto Sans TC','Inter',sans-serif;}
  .waveform{display:flex;align-items:center;gap:3px;height:36px;flex-shrink:0;}
  .wave-bar{width:3px;background:var(--accent);border-radius:2px;transition:height 0.1s;opacity:0.6;}
  @media(max-width:650px){.display-grid{grid-template-columns:1fr}.subtitle-translated{font-size:17px}main{padding:10px}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">🏥</div>
    <div class="logo-text">Med<span>Interpret</span></div>
  </div>
  <div class="header-status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">待機中</span>
  </div>
</header>

<main>
  <div class="controls">
    <span class="mode-label">模式</span>
    <button class="mode-btn active" id="btn-zh-en" onclick="setMode('zh-en')">粵語/普通話 → English</button>
    <button class="mode-btn" id="btn-en-zh" onclick="setMode('en-zh')">English → 中文</button>
    <button class="mic-btn start" id="micBtn" onclick="toggleListening()">
      <span>🎤</span><span id="micLabel">開始傳譯</span>
    </button>
  </div>

  <div class="settings-row">
    <label><input type="checkbox" id="chkMed" checked> 醫學術語標示</label>
    <label><input type="checkbox" id="chkSub" checked> 字幕欄</label>
    <span style="color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace;">● 醫學詞彙強化</span>
    <button class="clear-btn" onclick="clearAll()">CLEAR</button>
  </div>

  <div id="errorBanner" class="error-banner"></div>

  <div class="display-grid">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-tag tag-source">語音輸入</span>
        <span class="panel-lang" id="sourceLabel">粵語 / 普通話</span>
      </div>
      <div class="panel-body" id="sourceBody">
        <div class="empty-state" id="sourceEmpty">
          <div class="empty-icon">🎙️</div>
          <div class="empty-text">按「開始傳譯」後開始說話<br>支援廣東話、普通話、英語</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-tag tag-translation">即時譯文</span>
        <span class="panel-lang" id="translationLabel">English</span>
      </div>
      <div class="panel-body" id="translationBody">
        <div class="empty-state" id="translationEmpty">
          <div class="empty-icon">📝</div>
          <div class="empty-text">譯文將會在這裡顯示<br>醫學術語會自動標示</div>
        </div>
      </div>
    </div>
  </div>

  <div class="subtitle-bar" id="subtitleBar">
    <div class="subtitle-label">字幕</div>
    <div class="subtitle-content">
      <div class="subtitle-original" id="subOrig">—</div>
      <div class="subtitle-translated" id="subTrans">等待語音輸入…</div>
    </div>
    <div class="waveform" id="waveform"></div>
  </div>
</main>

<script>
const API = 'https://api.anthropic.com/v1/messages';
let mode = 'zh-en';
let recognition = null;
let isListening = false;
let interimEl = null;
let queue = [];
let busy = false;
let restartTimer = null;

// ── MODE ──────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  document.getElementById('sourceLabel').textContent = m === 'zh-en' ? '粵語 / 普通話' : 'English';
  document.getElementById('translationLabel').textContent = m === 'zh-en' ? 'English' : '中文譯文';
  document.getElementById('subTrans').textContent = m === 'zh-en' ? '等待語音輸入…' : 'Waiting for speech…';
  if (isListening) { stopListening(); setTimeout(startListening, 400); }
}

// ── MIC ───────────────────────────────────────────────────
function toggleListening() {
  isListening ? stopListening() : startListening();
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showError('請使用 Chrome 或 Edge 瀏覽器'); return; }

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = mode === 'zh-en' ? 'zh-HK' : 'en-US';

  recognition.onstart = () => {
    isListening = true;
    setUI(true);
    hideError();
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? (final += t) : (interim += t);
    }
    // show interim
    if (interimEl) interimEl.remove();
    if (interim) {
      interimEl = mkEl('div', 'transcript-item',
        '<div class="transcript-text interim">' + esc(interim) + '</div>');
      sourceBody().appendChild(interimEl);
      document.getElementById('subOrig').textContent = interim;
    }
    // commit final
    if (final.trim()) {
      if (interimEl) { interimEl.remove(); interimEl = null; }
      addSource(final.trim());
      document.getElementById('subOrig').textContent = final.trim();
      enqueue(final.trim());
    }
    scroll(); hideEmpty();
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    showError('語音錯誤: ' + e.error);
  };

  // stable restart — avoid rapid loop
  recognition.onend = () => {
    if (!isListening) return;
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      if (!isListening) return;
      try { recognition.start(); } catch (_) {}
    }, 300);
  };

  try { recognition.start(); } catch (e) { showError(e.message); }
}

function stopListening() {
  isListening = false;
  clearTimeout(restartTimer);
  if (recognition) { try { recognition.stop(); } catch (_) {} recognition = null; }
  setUI(false);
}

function setUI(on) {
  const btn = document.getElementById('micBtn');
  if (on) {
    btn.className = 'mic-btn stop';
    btn.innerHTML = '<span>⏹</span><span>停止傳譯</span>';
    document.getElementById('statusDot').className = 'dot listening';
    document.getElementById('statusText').textContent = '正在聆聽…';
    startWave();
  } else {
    btn.className = 'mic-btn start';
    btn.innerHTML = '<span>🎤</span><span>開始傳譯</span>';
    document.getElementById('statusDot').className = 'dot';
    document.getElementById('statusText').textContent = '待機中';
    stopWave();
  }
}

// ── TRANSLATE QUEUE ───────────────────────────────────────
function enqueue(text) { queue.push(text); drain(); }

async function drain() {
  if (busy || !queue.length) return;
  busy = true;
  await translate(queue.shift());
  busy = false;
  drain();
}

async function translate(text) {
  const loader = addLoader();
  const sys = mode === 'zh-en'
    ? 'You are a professional medical interpreter. Translate the Cantonese or Mandarin input into accurate English. Preserve all medical terminology precisely. Output ONLY the English translation, no explanation.'
    : 'You are a professional medical interpreter. Translate the English input into accurate Traditional Chinese (Hong Kong). Preserve all medical terminology precisely. Output ONLY the Chinese translation, no explanation.';
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: sys,
        messages: [{ role: 'user', content: text }]
      })
    });
    const d = await r.json();
    const out = d.content?.[0]?.text?.trim() || '（翻譯失敗）';
    loader.remove();
    addTranslation(out);
    document.getElementById('subTrans').textContent = out;
  } catch (e) {
    loader.remove();
    addTranslation('⚠ 錯誤: ' + e.message);
  }
}

// ── DOM HELPERS ───────────────────────────────────────────
const sourceBody = () => document.getElementById('sourceBody');
const transBody  = () => document.getElementById('translationBody');

function ts() {
  return new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function mkEl(tag, cls, html) {
  const el = document.createElement(tag);
  el.className = cls;
  el.innerHTML = html;
  return el;
}

function addSource(text) {
  sourceBody().appendChild(mkEl('div', 'transcript-item',
    '<div class="transcript-time">' + ts() + '</div>' +
    '<div class="transcript-text">' + esc(text) + '</div>'));
  scroll();
}

function addLoader() {
  const el = mkEl('div', 'transcript-item',
    '<div class="transcript-time">' + ts() + '</div>' +
    '<div class="translation-text loading"><div class="spinner"></div> 正在傳譯…</div>');
  transBody().appendChild(el);
  scroll();
  return el;
}

function addTranslation(text) {
  const hl = document.getElementById('chkMed').checked;
  transBody().appendChild(mkEl('div', 'transcript-item',
    '<div class="transcript-time">' + ts() + '</div>' +
    '<div class="translation-text">' + (hl ? highlight(text) : esc(text)) + '</div>'));
  scroll();
}

function hideEmpty() {
  document.getElementById('sourceEmpty').style.display = 'none';
  document.getElementById('translationEmpty').style.display = 'none';
}

function scroll() {
  [sourceBody(), transBody()].forEach(el => { el.scrollTop = el.scrollHeight; });
}

function clearAll() {
  sourceBody().innerHTML = '<div class="empty-state" id="sourceEmpty"><div class="empty-icon">🎙️</div><div class="empty-text">按「開始傳譯」後開始說話</div></div>';
  transBody().innerHTML  = '<div class="empty-state" id="translationEmpty"><div class="empty-icon">📝</div><div class="empty-text">譯文將會在這裡顯示</div></div>';
  document.getElementById('subOrig').textContent  = '—';
  document.getElementById('subTrans').textContent = mode === 'zh-en' ? '等待語音輸入…' : 'Waiting for speech…';
  interimEl = null;
}

// ── MEDICAL HIGHLIGHT ─────────────────────────────────────
const MED_EN = ['hypertension','hypotension','diabetes','mellitus','carcinoma','malignancy','myocardial','infarction','cerebrovascular','stroke','hemorrhage','ischemia','tachycardia','bradycardia','arrhythmia','fibrillation','thrombosis','embolism','aneurysm','sepsis','pneumonia','tuberculosis','nephritis','hepatitis','pancreatitis','edema','ascites','jaundice','cyanosis','dyspnea','anemia','leukemia','lymphoma','biopsy','laparoscopy','endoscopy','echocardiogram','MRI','chemotherapy','radiotherapy','immunotherapy','antibiotics','analgesic','anticoagulant','corticosteroid','diuretic','dialysis','intubation','ventilator','ICU','CPR'];
const MED_ZH = ['心臟病','血壓','高血壓','低血壓','糖尿病','癌症','腫瘤','惡性','手術','外科','藥物','過敏','敏感','發燒','頭暈','腦中風','心律','心跳','血糖','化療','放療','X光','磁力共振','電腦掃描','骨折','抗生素','止痛藥','抗凝血','消炎藥','利尿藥','腎衰竭','肝衰竭','肺炎','胰臟','膽囊','闌尾','敗血症','結核','腎炎','肝炎','胰腺炎','水腫','黃疸','呼吸困難','貧血','白血病','淋巴瘤','活檢','腹腔鏡','內窺鏡','超聲波','透析','插管','呼吸機','深切治療','心肺復甦','處方','診斷','症狀','急性','慢性','感染','炎症'];

function highlight(text) {
  let r = esc(text);
  (mode === 'zh-en' ? MED_EN : MED_ZH).forEach(t => {
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    r = r.replace(re, m => '<span class="med-term">' + m + '</span>');
  });
  return r;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── WAVEFORM ──────────────────────────────────────────────
let waveTimer = null;
function buildWave() {
  const wf = document.getElementById('waveform');
  wf.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.className = 'wave-bar'; b.style.height = '4px';
    wf.appendChild(b);
  }
}
function startWave() {
  buildWave();
  waveTimer = setInterval(() => {
    document.querySelectorAll('.wave-bar').forEach(b => {
      b.style.height = (Math.random() * 30 + 4) + 'px';
    });
  }, 130);
}
function stopWave() {
  clearInterval(waveTimer);
  document.querySelectorAll('.wave-bar').forEach(b => { b.style.height = '4px'; });
}

// ── ERROR ─────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = '⚠ ' + msg; el.style.display = 'block';
}
function hideError() { document.getElementById('errorBanner').style.display = 'none'; }

// ── SUBTITLE TOGGLE ───────────────────────────────────────
document.getElementById('chkSub').addEventListener('change', e => {
  document.getElementById('subtitleBar').style.display = e.target.checked ? 'flex' : 'none';
});

buildWave();
</script>
</body>
</html>
